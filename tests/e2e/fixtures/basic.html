<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listener Lens fixture</title>
  </head>
  <body>
    <button id="copy" type="button" onclick="void 0">Copy fixture</button>
    <script>
      window.addEventListener("click", () => undefined);
      document.addEventListener("copy", () => undefined);
      const button = document.querySelector("#copy");
      button.addEventListener("input", () => undefined, {
        capture: true,
        once: true,
      });
      button.onchange = () => undefined;
      button.setAttribute("onkeydown", "void 0");
      document.body.dataset.fixtureReady = "true";
      const shadowHost = document.createElement("div");
      shadowHost.id = "shadow-host";
      document.body.append(shadowHost);
      const openRoot = shadowHost.attachShadow({ mode: "open" });
      const shadowButton = document.createElement("button");
      shadowButton.textContent = "Shadow fixture";
      openRoot.append(shadowButton);
      shadowButton.addEventListener("click", () => undefined);
      const closedHost = document.createElement("div");
      closedHost.id = "closed-shadow-host";
      document.body.append(closedHost);
      const closedRoot = closedHost.attachShadow({ mode: "closed" });
      closedRoot.addEventListener("copy", () => undefined);
      const iframe = document.createElement("iframe");
      iframe.src = "/context-frame.html";
      iframe.title = "same origin context";
      document.body.append(iframe);
      history.pushState({}, "", "#spa");
      window.dispatchEvent(new PopStateEvent("popstate"));
    </script>
  </body>
</html>
