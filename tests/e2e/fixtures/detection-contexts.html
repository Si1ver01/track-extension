<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Проверка lifecycle и контекстов</title>
  </head>
  <body>
    <button type="button">Property-обработчик</button>
    <section onfocus="void 'coverage-inline-secret'">Inline-обработчик</section>
    <input value="coverage-input-secret" />
    <script>
      const button = document.querySelector("button");
      const inline = document.querySelector("section");
      const state = {
        token: crypto.randomUUID(),
        persisted: null,
        popCount: 0,
        firstCalls: 0,
        secondCalls: 0,
        correctThis: false,
        lifecycleCalls: {},
        nativeCalls: {},
        onceReads: 0,
      };
      const lifecycle = new Map();
      function lifecycleTarget(
        name,
        options = {},
        withSignal = true,
        nativeControl = false,
      ) {
        const eventType = nativeControl ? "lifecycle-native-control" : "click";
        const counters = nativeControl
          ? state.nativeCalls
          : state.lifecycleCalls;
        const target = document.createElement(`lifecycle-${name}`);
        document.body.append(target);
        counters[name] = 0;
        const callback = () => {
          counters[name] += 1;
        };
        const first = new AbortController();
        const second = new AbortController();
        const item = { target, callback, first, second };
        if (!nativeControl) lifecycle.set(name, item);
        if (name === "blocked")
          first.signal.addEventListener("abort", (event) =>
            event.stopImmediatePropagation(),
          );
        if (name === "reentrant")
          first.signal.addEventListener("abort", () =>
            target.addEventListener(eventType, callback, {
              signal: second.signal,
            }),
          );
        target.addEventListener(
          eventType,
          callback,
          withSignal ? { ...options, signal: first.signal } : options,
        );
        if (
          !nativeControl &&
          ["once-before", "once-after", "old", "reentrant"].includes(name)
        )
          item.control = lifecycleTarget(name, options, withSignal, true);
        return item;
      }
      function first() {
        void "coverage-callback-secret";
        state.firstCalls += 1;
        state.correctThis = this === button;
        return false;
      }
      function second() {
        state.secondCalls += 1;
        state.correctThis = this === button;
        return false;
      }
      window.addEventListener("pageshow", (event) => {
        state.persisted = event.persisted;
      });
      window.addEventListener("popstate", () => {
        state.popCount += 1;
      });
      setTimeout(() => window.addEventListener("click", () => {}), 500);
      window.__coverageFixture = {
        run(operation) {
          switch (operation) {
            case "lifecycle-init": {
              const once = lifecycleTarget(
                "once",
                {
                  get once() {
                    state.onceReads += 1;
                    return "truthy";
                  },
                },
                false,
              );
              lifecycleTarget("once-before", { once: true, passive: true });
              lifecycleTarget("once-after", { once: true, passive: true });
              lifecycleTarget("once-abort", { once: true });
              const signal = lifecycleTarget("signal");
              signal.target.addEventListener("click", signal.callback, {
                capture: true,
                signal: signal.first.signal,
              });
              lifecycleTarget("duplicate", { passive: true, once: false });
              lifecycleTarget("old");
              lifecycleTarget("synthetic");
              lifecycleTarget("blocked");
              lifecycleTarget("reentrant");
              const ignored = document.createElement("lifecycle-ignored");
              const aborted = new AbortController();
              aborted.abort();
              ignored.addEventListener("click", null);
              ignored.addEventListener("click", once.callback, {
                signal: aborted.signal,
              });
              break;
            }
            case "lifecycle-once-fire":
              for (let index = 0; index < 2; index++)
                lifecycle.get("once").target.dispatchEvent(new Event("click"));
              break;
            case "lifecycle-once-readd":
              for (const name of ["once-before", "once-after"]) {
                const item = lifecycle.get(name);
                const control = item.control;
                if (name === "once-after")
                  control.target.dispatchEvent(
                    new Event("lifecycle-native-control"),
                  );
                control.target.addEventListener(
                  "lifecycle-native-control",
                  control.callback,
                  {
                    once: false,
                    passive: false,
                    signal: control.second.signal,
                  },
                );
                control.target.dispatchEvent(
                  new Event("lifecycle-native-control"),
                );
                control.target.dispatchEvent(
                  new Event("lifecycle-native-control"),
                );
                if (name === "once-after")
                  item.target.dispatchEvent(new Event("click"));
                item.target.addEventListener("click", item.callback, {
                  once: false,
                  passive: false,
                  signal: item.second.signal,
                });
                item.target.dispatchEvent(new Event("click"));
                item.target.dispatchEvent(new Event("click"));
              }
              break;
            case "lifecycle-once-old-abort":
              for (const name of ["once-before", "once-after"]) {
                const item = lifecycle.get(name);
                item.control.first.abort();
                item.control.target.dispatchEvent(
                  new Event("lifecycle-native-control"),
                );
                item.control.target.dispatchEvent(
                  new Event("lifecycle-native-control"),
                );
                item.first.abort();
                item.target.dispatchEvent(new Event("click"));
                item.target.dispatchEvent(new Event("click"));
              }
              break;
            case "lifecycle-once-abort":
              lifecycle.get("once-abort").first.abort();
              break;
            case "lifecycle-signal-abort":
              lifecycle.get("signal").first.abort();
              lifecycle.get("signal").target.dispatchEvent(new Event("click"));
              break;
            case "lifecycle-duplicate": {
              const item = lifecycle.get("duplicate");
              item.target.addEventListener("click", item.callback, {
                once: true,
                passive: false,
                signal: item.second.signal,
              });
              item.second.abort();
              item.target.dispatchEvent(new Event("click"));
              item.target.dispatchEvent(new Event("click"));
              break;
            }
            case "lifecycle-duplicate-abort":
              lifecycle.get("duplicate").first.abort();
              break;
            case "lifecycle-old-readd": {
              const item = lifecycle.get("old");
              const control = item.control;
              control.target.removeEventListener(
                "lifecycle-native-control",
                control.callback,
              );
              control.target.addEventListener(
                "lifecycle-native-control",
                control.callback,
                { signal: control.second.signal },
              );
              control.first.abort();
              control.target.dispatchEvent(
                new Event("lifecycle-native-control"),
              );
              item.target.removeEventListener("click", item.callback);
              item.target.addEventListener("click", item.callback, {
                signal: item.second.signal,
              });
              item.first.abort();
              item.target.dispatchEvent(new Event("click"));
              break;
            }
            case "lifecycle-synthetic":
              lifecycle
                .get("synthetic")
                .first.signal.dispatchEvent(new Event("abort"));
              lifecycle
                .get("synthetic")
                .target.dispatchEvent(new Event("click"));
              break;
            case "lifecycle-blocked":
              lifecycle.get("blocked").first.abort();
              lifecycle.get("blocked").target.dispatchEvent(new Event("click"));
              break;
            case "lifecycle-reentrant":
              lifecycle.get("reentrant").control.first.abort();
              lifecycle
                .get("reentrant")
                .control.target.dispatchEvent(
                  new Event("lifecycle-native-control"),
                );
              lifecycle.get("reentrant").first.abort();
              lifecycle
                .get("reentrant")
                .target.dispatchEvent(new Event("click"));
              break;
            case "lifecycle-reentrant-abort":
              lifecycle.get("reentrant").second.abort();
              break;
            case "lifecycle-remove":
              for (const name of ["once-before", "once-after"]) {
                const item = lifecycle.get(name);
                item.target.removeEventListener("click", item.callback);
              }
              break;
            case "lifecycle-bfcache":
              lifecycleTarget("bfcache", { once: true });
              lifecycleTarget("bfcache-removed").first.abort();
              break;
            case "lifecycle-bfcache-abort":
              lifecycle.get("bfcache").first.abort();
              break;
            case "property-add":
            case "property-repeat":
              button.onclick = first;
              state.getterIdentity = button.onclick === first;
              break;
            case "property-replace":
            case "property-readd":
              button.onclick = second;
              state.getterIdentity = button.onclick === second;
              break;
            case "property-remove":
              button.onclick = null;
              state.getterIdentity = button.onclick === null;
              break;
            case "inline-replace":
              inline.setAttribute(
                "onfocus",
                "void 'coverage-inline-replacement-secret'",
              );
              break;
            case "inline-remove":
              inline.removeAttribute("onfocus");
              break;
            case "inline-readd": {
              const attribute = document.createAttribute("onfocus");
              attribute.value = "void 'coverage-inline-readded-secret'";
              inline.setAttributeNode(attribute);
              break;
            }
            case "shadow":
              for (const mode of ["open", "closed"]) {
                const host = document.createElement("div");
                document.body.append(host);
                const root = host.attachShadow({ mode });
                root.addEventListener("copy", () => {});
                const child = document.createElement("button");
                root.append(child);
                child.onpointerdown = () => {};
                child.setAttribute("onblur", "void 'coverage-shadow-secret'");
              }
              break;
            case "spa-push":
              history.pushState({}, "", "?route=push");
              document.addEventListener("keyup", () => {});
              break;
            case "spa-replace":
              history.replaceState({}, "", "?route=replace");
              document.addEventListener("change", () => {});
              break;
            case "spa-after-back":
              window.addEventListener("paste", () => {});
              break;
            case "overflow":
              for (let index = 0; index < 205; index += 1) {
                const target = document.createElement("span");
                document.body.append(target);
                target.onmousedown = () => {};
              }
              break;
          }
          if (operation.startsWith("property-")) {
            state.cancelled = !button.dispatchEvent(
              new Event("click", { cancelable: true }),
            );
          }
          return { ...state, route: location.search };
        },
      };
    </script>
  </body>
</html>
